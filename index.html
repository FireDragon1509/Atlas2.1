<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #05080c;
            color: #00eaff;
            font-family: Arial, sans-serif;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .atlas {
            width: 100%;
            text-align: center;
        }

        .core {
            width: 220px;
            height: 220px;
            margin: auto;

            border: 2px solid #00eaff;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow:
                0 0 20px #00eaff,
                0 0 60px rgba(0, 234, 255, 0.4),
                inset 0 0 30px rgba(0, 234, 255, 0.3);

            animation: pulse 3s infinite ease-in-out;
        }

        .core::before {
            content: "";

            width: 130px;
            height: 130px;

            border: 2px solid #00eaff;
            border-radius: 50%;

            box-shadow: 0 0 20px #00eaff;
        }

        h1 {
            margin-top: 35px;

            font-size: 48px;
            letter-spacing: 12px;

            text-shadow: 0 0 15px #00eaff;
        }

        #status {
            margin-top: 15px;

            color: #7899a3;

            letter-spacing: 3px;
            font-size: 12px;
        }

        #transcript {
            margin: 20px auto 0;

            padding: 0 20px;

            max-width: 700px;

            color: white;

            font-size: 16px;

            min-height: 24px;
        }

        #response {
            margin: 15px auto 0;

            padding: 0 20px;

            max-width: 700px;

            color: #00eaff;

            font-size: 17px;

            line-height: 1.5;

            min-height: 24px;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }
        }
    </style>
</head>

<body>

    <div class="atlas">

        <div class="core"></div>

        <h1>ATLAS</h1>

        <div id="status">
            INITIALIZING...
        </div>

        <div id="transcript"></div>

        <div id="response"></div>

    </div>


    <script>

        const status =
            document.getElementById("status");

        const transcript =
            document.getElementById("transcript");

        const responseBox =
            document.getElementById("response");


        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        let recognition;

        let speaking = false;


        /*
        ========================================
        ATLAS AI BRAIN
        ========================================
        */

        async function askATLAS(message) {

            status.textContent = "THINKING...";

            responseBox.textContent = "";


            try {

                const response =
                    await fetch("/api/chat", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })

                    });


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "AI request failed"
                    );

                }


                const reply =
                    data.reply;


                responseBox.textContent =
                    reply;


                speak(reply);


            } catch (error) {

                console.error(error);

                status.textContent =
                    "SYSTEM ERROR";

                responseBox.textContent =
                    "I'm having trouble connecting to my AI system.";

                setTimeout(
                    startListening,
                    2000
                );

            }

        }


        /*
        ========================================
        ATLAS VOICE
        ========================================
        */

        function speak(text) {

            speaking = true;

            status.textContent =
                "SPEAKING...";


            window.speechSynthesis.cancel();


            const voice =
                new SpeechSynthesisUtterance(text);


            voice.lang = "en-US";

            voice.rate = 1;

            voice.pitch = 1;

            voice.volume = 1;


            voice.onend = function () {

                speaking = false;

                status.textContent =
                    "LISTENING...";


                setTimeout(
                    startListening,
                    500
                );

            };


            window.speechSynthesis.speak(
                voice
            );

        }


        /*
        ========================================
        START LISTENING
        ========================================
        */

        function startListening() {

            if (speaking) return;


            try {

                recognition.start();

            } catch (error) {

                console.log(
                    "Recognition already running."
                );

            }

        }


        /*
        ========================================
        SPEECH RECOGNITION
        ========================================
        */

        if (!SpeechRecognition) {

            status.textContent =
                "VOICE NOT SUPPORTED";

        } else {

            recognition =
                new SpeechRecognition();


            recognition.lang =
                "en-US";


            recognition.continuous =
                false;


            recognition.interimResults =
                true;


            recognition.onstart =
                function () {

                    status.textContent =
                        "LISTENING...";

                };


            recognition.onresult =
                function (event) {

                    let text = "";


                    for (
                        let i = event.resultIndex;
                        i < event.results.length;
                        i++
                    ) {

                        text +=
                            event.results[i][0]
                                .transcript;

                    }


                    transcript.textContent =
                        text;


                    const lastResult =
                        event.results[
                            event.results.length - 1
                        ];


                    if (lastResult.isFinal) {

                        const command =
                            text.trim();


                        if (command.length > 0) {

                            askATLAS(command);

                        }

                    }

                };


            recognition.onerror =
                function (event) {

                    console.log(
                        "Speech error:",
                        event.error
                    );


                    if (
                        event.error ===
                        "not-allowed"
                    ) {

                        status.textContent =
                            "MICROPHONE ACCESS DENIED";

                    }

                };


            recognition.onend =
                function () {

                    if (!speaking) {

                        setTimeout(
                            startListening,
                            500
                        );

                    }

                };


            /*
            ====================================
            AUTOMATIC START
            ====================================
            */

            window.addEventListener(
                "load",
                function () {

                    setTimeout(
                        startListening,
                        1000
                    );

                }
            );

        }

    </script>

</body>
</html>
